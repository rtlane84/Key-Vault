openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: License Key Delivery API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: products
    description: Product management
  - name: keys
    description: License key management
  - name: orders
    description: Order management
  - name: stripe
    description: Stripe payments
  - name: ebay
    description: eBay integration
  - name: ebay-listings
    description: eBay listings management
  - name: sync-logs
    description: Sync activity logs
  - name: dashboard
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: sellerRegister
      tags: [auth]
      summary: Seller registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResult"
        "409":
          description: Conflict (email or slug exists)

  # Tenants
  /tenants/me:
    get:
      operationId: getMyTenant
      tags: [auth]
      summary: Get current tenant settings
      responses:
        "200":
          description: Tenant settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    patch:
      operationId: updateMyTenant
      tags: [auth]
      summary: Update current tenant settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  # Public Storefront
  /public/tenants/{slug}:
    get:
      operationId: getPublicTenant
      tags: [auth]
      summary: Get public tenant branding
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTenant"
        "404":
          description: Tenant not found

  /public/tenants/{slug}/products:
    get:
      operationId: listTenantProducts
      tags: [products]
      summary: List public products for a tenant
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProduct"
        "404":
          description: Tenant not found

  # Products (admin)
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/public:
    get:
      operationId: listPublicProducts
      tags: [products]
      summary: List active products (public, no auth)
      responses:
        "200":
          description: Active products for storefront
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProduct"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /products/{slug}/by-slug:
    get:
      operationId: getProductBySlug
      tags: [products]
      summary: Get a public product by slug (no auth)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProduct"
        "404":
          description: Not found

  # License Keys
  /keys:
    get:
      operationId: listKeys
      tags: [keys]
      summary: List license keys
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [available, assigned, delivered, failed]
      responses:
        "200":
          description: List of keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LicenseKey"
    post:
      operationId: createKey
      tags: [keys]
      summary: Create a single license key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseKeyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseKey"

  /keys/import:
    post:
      operationId: importKeys
      tags: [keys]
      summary: Bulk import license keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyImport"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyImportResult"

  /keys/{id}:
    delete:
      operationId: deleteKey
      tags: [keys]
      summary: Delete a license key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Orders
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, fulfilled, failed, refunded]
        - name: source
          in: query
          schema:
            type: string
            enum: [manual, ebay, stripe]
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Manually create and fulfill an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  /orders/{id}/fulfill:
    post:
      operationId: fulfillOrder
      tags: [orders]
      summary: Manually fulfill a pending/failed order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fulfilled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  /orders/{id}/resend-email:
    post:
      operationId: resendOrderEmail
      tags: [orders]
      summary: Re-send the license key email for a fulfilled order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendEmailResult"
        "404":
          description: Not found
        "400":
          description: Order not fulfilled

  # Stripe
  /stripe/checkout:
    post:
      operationId: createCheckoutSession
      tags: [stripe]
      summary: Create a Stripe Checkout session for a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "404":
          description: Product not found
        "400":
          description: Product has no Stripe Price ID

  # Stripe Connect
  /stripe/connect:
    post:
      operationId: stripeConnect
      tags: [stripe]
      summary: Get Stripe Connect URL
      responses:
        "200":
          description: Stripe Connect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        "400":
          description: Client not configured

  /stripe/callback:
    get:
      operationId: stripeCallback
      tags: [stripe]
      summary: Stripe Connect callback
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to dashboard

  /stripe/webhook:
    post:
      operationId: stripeWebhook
      tags: [stripe]
      summary: Stripe webhook endpoint (raw body)
      responses:
        "200":
          description: Acknowledged

  # eBay integration
  /ebay/status:
    get:
      operationId: getEbayStatus
      tags: [ebay]
      summary: Get eBay connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayStatus"

  /ebay/connect:
    get:
      operationId: getEbayConnectUrl
      tags: [ebay]
      summary: Get eBay OAuth authorization URL
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayConnectUrl"

  /ebay/disconnect:
    post:
      operationId: disconnectEbay
      tags: [ebay]
      summary: Disconnect eBay account
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayStatus"

  /ebay/sync:
    post:
      operationId: triggerEbaySync
      tags: [ebay]
      summary: Trigger eBay order sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /ebay/mock-sync:
    post:
      operationId: triggerMockSync
      tags: [ebay]
      summary: Trigger mock eBay sync (no real eBay account needed)
      responses:
        "200":
          description: Mock sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /ebay/poll-settings:
    get:
      operationId: getEbayPollSettings
      tags: [ebay]
      summary: Get eBay polling configuration
      responses:
        "200":
          description: Poll settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayPollSettings"
    patch:
      operationId: updateEbayPollSettings
      tags: [ebay]
      summary: Update eBay polling interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbayPollSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayPollSettings"

  # eBay Listings
  /ebay/listings:
    get:
      operationId: listEbayListings
      tags: [ebay-listings]
      summary: List imported eBay listings
      parameters:
        - name: mapped
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: eBay listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EbayListing"

  /ebay/listings/sync:
    post:
      operationId: syncEbayListings
      tags: [ebay-listings]
      summary: Import/refresh listings from eBay
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayListingSyncResult"

  /ebay/listings/{id}/map:
    patch:
      operationId: mapEbayListing
      tags: [ebay-listings]
      summary: Map an eBay listing to a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbayListingMapInput"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayListing"
        "404":
          description: Not found

  # Sync logs
  /sync-logs:
    get:
      operationId: listSyncLogs
      tags: [sync-logs]
      summary: List sync log entries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Sync logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncLog"

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Dashboard overview statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Active alerts (products with no available keys, failed orders)
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent fulfilled orders and sync events
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResult:
      type: object
      required: [token]
      properties:
        token:
          type: string

    Product:
      type: object
      required: [id, name, slug, sku, price, active, availableKeyCount, totalKeyCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        sku:
          type: string
        description:
          type: ["string", "null"]
        shortDescription:
          type: ["string", "null"]
        price:
          type: integer
        imageUrl:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        active:
          type: boolean
        stripeProductId:
          type: ["string", "null"]
        stripePriceId:
          type: ["string", "null"]
        ebayListingId:
          type: ["string", "null"]
        emailTemplate:
          type: ["string", "null"]
        lowInventoryThreshold:
          type: integer
        availableKeyCount:
          type: integer
        totalKeyCount:
          type: integer
        createdAt:
          type: string

    PublicProduct:
      type: object
      required: [id, name, slug, price, availableKeyCount]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        shortDescription:
          type: ["string", "null"]
        price:
          type: integer
        imageUrl:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        stripePriceId:
          type: ["string", "null"]
        availableKeyCount:
          type: integer

    PublicTenant:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        supportEmail:
          type: ["string", "null"]

    ProductInput:
      type: object
      required: [name, slug, sku, price]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        description:
          type: string
        shortDescription:
          type: string
        price:
          type: integer
          minimum: 0
        imageUrl:
          type: string
        activationInstructions:
          type: string
        category:
          type: string
        active:
          type: boolean
        stripeProductId:
          type: string
        stripePriceId:
          type: string
        ebayListingId:
          type: string
        emailTemplate:
          type: string
        lowInventoryThreshold:
          type: integer
          minimum: 0

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
        sku:
          type: string
        description:
          type: ["string", "null"]
        shortDescription:
          type: ["string", "null"]
        price:
          type: integer
          minimum: 0
        imageUrl:
          type: ["string", "null"]
        activationInstructions:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        active:
          type: boolean
        stripeProductId:
          type: ["string", "null"]
        stripePriceId:
          type: ["string", "null"]
        ebayListingId:
          type: ["string", "null"]
        emailTemplate:
          type: ["string", "null"]
        lowInventoryThreshold:
          type: integer
          minimum: 0

    LicenseKey:
      type: object
      required: [id, productId, keyValue, status, createdAt]
      properties:
        id:
          type: integer
        productId:
          type: integer
        keyValue:
          type: string
        status:
          type: string
          enum: [available, assigned, delivered, failed]
        orderId:
          type: ["integer", "null"]
        assignedAt:
          type: ["string", "null"]
        deliveredAt:
          type: ["string", "null"]
        createdAt:
          type: string

    LicenseKeyInput:
      type: object
      required: [productId, keyValue]
      properties:
        productId:
          type: integer
        keyValue:
          type: string
          minLength: 1

    KeyImport:
      type: object
      required: [productId, keys]
      properties:
        productId:
          type: integer
        keys:
          type: array
          items:
            type: string

    KeyImportResult:
      type: object
      required: [imported, skipped, total]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        total:
          type: integer

    Order:
      type: object
      required: [id, source, status, buyerEmail, productId, createdAt]
      properties:
        id:
          type: integer
        source:
          type: string
          enum: [manual, ebay, stripe]
        status:
          type: string
          enum: [pending, paid, fulfilled, failed, refunded]
        buyerEmail:
          type: string
        buyerName:
          type: ["string", "null"]
        productId:
          type: integer
        productName:
          type: ["string", "null"]
        quantity:
          type: integer
        ebayOrderId:
          type: ["string", "null"]
        ebayLineItemId:
          type: ["string", "null"]
        stripePaymentIntentId:
          type: ["string", "null"]
        stripeSessionId:
          type: ["string", "null"]
        assignedKeyId:
          type: ["integer", "null"]
        assignedKeyValue:
          type: ["string", "null"]
        failureReason:
          type: ["string", "null"]
        fulfilledAt:
          type: ["string", "null"]
        createdAt:
          type: string

    OrderInput:
      type: object
      required: [buyerEmail, productId]
      properties:
        buyerEmail:
          type: string
        buyerName:
          type: string
        productId:
          type: integer

    CheckoutInput:
      type: object
      required: [productId]
      properties:
        productId:
          type: integer
        successUrl:
          type: string
        cancelUrl:
          type: string

    CheckoutResult:
      type: object
      required: [url]
      properties:
        url:
          type: string

    ResendEmailResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type: ["string", "null"]

    EbayStatus:
      type: object
      required: [connected, mockMode]
      properties:
        connected:
          type: boolean
        mockMode:
          type: boolean
        sellerId:
          type: ["string", "null"]
        tokenExpiresAt:
          type: ["string", "null"]
        lastSyncAt:
          type: ["string", "null"]
        pollIntervalMinutes:
          type: integer

    EbayConnectUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string

    EbayPollSettings:
      type: object
      required: [pollIntervalMinutes]
      properties:
        pollIntervalMinutes:
          type: integer

    EbayPollSettingsInput:
      type: object
      required: [pollIntervalMinutes]
      properties:
        pollIntervalMinutes:
          type: integer
          enum: [0, 1, 2, 5, 10, 15]

    EbayListing:
      type: object
      required: [id, listingId, title, status, quantity, createdAt]
      properties:
        id:
          type: integer
        listingId:
          type: string
        title:
          type: string
        sku:
          type: ["string", "null"]
        price:
          type: ["integer", "null"]
        quantity:
          type: integer
        status:
          type: string
        productId:
          type: ["integer", "null"]
        productName:
          type: ["string", "null"]
        lastSyncAt:
          type: ["string", "null"]
        createdAt:
          type: string

    EbayListingSyncResult:
      type: object
      required: [imported, updated, total]
      properties:
        imported:
          type: integer
        updated:
          type: integer
        total:
          type: integer

    EbayListingMapInput:
      type: object
      required: [productId]
      properties:
        productId:
